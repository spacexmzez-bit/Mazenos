name: Deploy MazenOS
​on:
push:
branches:
- main
workflow_dispatch:
​jobs:
deploy:
runs-on: ubuntu-latest
name: Migrate D1 & Deploy Worker + Pages
steps:
- name: Checkout Repository
uses: actions/checkout@v4
​- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: 20
​- name: Apply Cloudflare D1 Relational Migrations
uses: cloudflare/wrangler-action@v3
with:
apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
command: d1 migrations apply mazenos_db --remote
​- name: Deploy Cloudflare Worker (mazenos)
uses: cloudflare/wrangler-action@v3
with:
apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
command: deploy
​- name: Deploy Cloudflare Pages Command Deck
uses: cloudflare/wrangler-action@v3
with:
apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
command: pages deploy . --project-name=mazenos-deck
